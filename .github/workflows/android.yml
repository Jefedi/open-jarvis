name: Android - compilation et tests

on:
  push:
    branches: [main, 'murena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Récupérer les sources sans modifier le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Conserver les sources exactes de cet essai
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git archive --format=zip --output=ci-results/sources.zip HEAD
          printf 'commit=%s\nvariant=debug\nphysical_device_tested=false\nlive_provider_credentials=false\n' "$(git rev-parse HEAD)" > ci-results/build-info.txt
          printf '%s  %s\n' a8451eeda314d0568b5340498b36edf147a8f0d692c5ff58082d477abe9146e4 gradle/wrapper/gradle-wrapper.jar | sha256sum --check --strict
      - name: Installer Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer Gradle et vérifier les wrappers
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Installer le SDK Android nécessaire
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$manager"
          printf 'ANDROID_HOME=%s\nSDK_MANAGER=%s\n' "$sdk" "$manager" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tee ci-results/sdk.log
      - name: Compiler, tester et analyser (aucune clé API réelle)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace --continue \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest \
            2>&1 | tee ci-results/gradle.log
      - name: Démarrer un Android AOSP sans Google Play Services
        shell: bash
        run: |
          set -euo pipefail
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-34;default;x86_64' 2>&1 | tee ci-results/emulator-sdk.log
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/jarvis-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avdmanager="$(dirname "$SDK_MANAGER")/avdmanager"
          printf 'no\n' | "$avdmanager" create avd --force --name jarvis-test --path "$ANDROID_AVD_HOME/jarvis-test.avd" --package 'system-images;android-34;default;x86_64' --device pixel_6
          test -f "$ANDROID_AVD_HOME/jarvis-test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee ci-results/avds.txt
          grep -Fx 'jarvis-test' ci-results/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd jarvis-test -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 > ci-results/emulator.log 2>&1 &
          emulator_pid=$!
          echo "emulator_pid=$emulator_pid" >> ci-results/build-info.txt
          adb="$ANDROID_HOME/platform-tools/adb"
          ready=false
          for i in $(seq 1 180); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then tail -n 80 ci-results/emulator.log; exit 1; fi
            if [[ "$(timeout 5 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then ready=true; break; fi
            sleep 2
          done
          "$ready"
          "$adb" shell input keyevent 82
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0
          "$adb" logcat -c
          "$adb" shell getprop > ci-results/android-properties.txt
      - name: Exécuter les parcours UI, Keystore, confirmation et TTS système
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:connectedDebugAndroidTest 2>&1 | tee ci-results/android-tests.log
          echo 'aosp_emulator_tests=passed' >> ci-results/build-info.txt
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" logcat -d -b crash > ci-results/crashes.txt
          "$adb" shell pm clear com.openjarvis
          "$adb" shell am start -W -n com.openjarvis/.ui.MainActivity | tee ci-results/launch.txt
          sleep 3
          "$adb" shell pidof com.openjarvis | tee ci-results/pid.txt
          "$adb" exec-out screencap -p > ci-results/first-launch.png
          "$adb" shell uiautomator dump /sdcard/jarvis-ui.xml
          "$adb" pull /sdcard/jarvis-ui.xml ci-results/jarvis-ui.xml
          "$adb" shell cmd role add-role-holder --user 0 android.app.role.ASSISTANT com.openjarvis
          "$adb" shell cmd role get-role-holders --user 0 android.app.role.ASSISTANT | tee ci-results/assistant-role.txt
          grep -Fx 'com.openjarvis' ci-results/assistant-role.txt
      - name: Vérifier et identifier l'APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk" | tee ci-results/signature.txt
          sha256sum "$apk" > ci-results/APK-SHA256.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > ci-results/apk-metadata.txt
      - name: Publier l'APK testé
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-jarvis-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ci-results/APK-SHA256.txt
            ci-results/build-info.txt
            ci-results/signature.txt
            ci-results/apk-metadata.txt
          if-no-files-found: error
          retention-days: 14
      - name: Capturer les diagnostics Android disponibles
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          adb="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          if [[ -x "$adb" ]] && "$adb" get-state >/dev/null 2>&1; then
            "$adb" logcat -d > ci-results/logcat.txt
            "$adb" exec-out screencap -p > ci-results/last-screen.png
          fi
      - name: Conserver les diagnostics même en cas d'échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            ci-results/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
