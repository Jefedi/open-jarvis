name: Android - compilation et tests

on:
  push:
    branches: [main, 'murena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Conserver les sources exactes de cet essai
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git archive --format=zip --output=ci-results/sources.zip HEAD
          printf 'commit=%s\nvariant=debug\ndevice_tested=false\n' "$GITHUB_SHA" > ci-results/build-info.txt
      - name: Installer Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle 8.2.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Installer le SDK Android nécessaire
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$manager"
          printf 'ANDROID_HOME=%s\n' "$sdk" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" 'platforms;android-34' 'build-tools;34.0.0' 2>&1 | tee ci-results/sdk.log
      - name: Compiler, tester et analyser (sans clé API)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace --continue \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            2>&1 | tee ci-results/gradle.log
      - name: Vérifier et identifier l'APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > ci-results/APK-SHA256.txt
      - name: Publier l'APK de test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-jarvis-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ci-results/APK-SHA256.txt
            ci-results/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Conserver les diagnostics même en cas d'échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            ci-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
